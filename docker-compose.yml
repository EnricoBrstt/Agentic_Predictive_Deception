services:
  honeypot:
    build: 
      context: ./honeypotContainer
    ports:
      - "2222:2222"
    environment:
      - ORCHESTRATOR_URL=http://agentic-system:8000/new_command
    networks:
      - honeypot_net
    restart: unless-stopped
    depends_on:
      - agentic-system

  agentic-system:
    build:
      context: ./agentContainer
    networks:
      - honeypot_net
      - backend_net
    environment:
      - BACKEND_MCP_URL=http://backend:8000/sse
      - FORGERY_MCP_URL=http://mcp-forgery:8000/sse
      - PROVIDER=cloud                                                    # Modifica provider
      - MODEL_NAME=deepseek/deepseek-v4-flash                             # Modifica modello
      - NUM_PREDICTION=5
    secrets:
      - llm_config_secret
    depends_on:
      - backend
      - mcp-forgery
    restart: unless-stopped

  backend:
    build: ./backendContainer
    volumes:
      - type: bind
        source: ${CHROMA_STORAGE_PATH}
        target: /app/data/vector_db
        bind:
          create_host_path: false
      - type: bind
        source: ${SESSIONS_PATH}
        target: /app/data/sessions
        bind:
          create_host_path: false
      - type: bind
        source: ${ARTIFACTS_PATH}
        target: /app/data/artifacts
        bind:
          create_host_path: false
    networks:
      - backend_net
    
  mcp-forgery:
    build:
      context: ./mcpForgeryContainer
    networks:
      - honeypot_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Scrive direttamente usando il socket di Docker nel container!

  attacker:
    build:
      context: .                              # Root: riusa agent_connector.py/adapter_connector.py da agentContainer/
      dockerfile: attackerContainer/Dockerfile
    profiles: ["attacker"]                    # Non parte con un `docker-compose up` semplice: va lanciato esplicitamente
    environment:
      - HONEYPOT_HOST=honeypot
      - HONEYPOT_PORT=2222
      - HONEYPOT_USER=honeypot
      - HONEYPOT_PASSWORD=password123
      - PROVIDER=cloud                         # Modifica provider
      - MODEL_NAME=deepseek/deepseek-v4-flash  # Modifica modello
      - MAX_TURNS=25
    secrets:
      - llm_config_secret
    volumes:
      - ./attackerContainer/transcripts:/app/transcripts
    networks:
      - honeypot_net
    depends_on:
      - honeypot

networks:
  honeypot_net:
    driver: bridge
  backend_net:
    driver: bridge

secrets:
  llm_config_secret:
    file: ./.env