services:
  honeypot:
    build: 
      context: ./honeypotContainer
    ports:
      - "2222:2222"
    environment:
      - ORCHESTRATOR_URL=http://agentic-system:8000/new_command
    networks:
      - honeypot_net
      - attack_net
    restart: unless-stopped
    depends_on:
      - agentic-system

  agentic-system:
    build:
      context: ./agentContainer
    networks:
      - honeypot_net
      - backend_net
    environment:
      - BACKEND_MCP_URL=http://backend:8000/sse
      - FORGERY_MCP_URL=http://mcp-forgery:8000/sse
      - PROVIDER=cloud                        # cloud | local
      - MODEL_NAME=deepseek/deepseek-chat     # LLM model
      - NUM_PREDICTION=3
    secrets:
      - llm_config_secret
    depends_on:                               # Wait until the MCP servers accept connections
      backend:
        condition: service_healthy
      mcp-forgery:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backendContainer
    volumes:
      - type: bind
        source: ${CHROMA_STORAGE_PATH}
        target: /app/data/vector_db
        bind:
          create_host_path: false
      - type: bind
        source: ${SESSIONS_PATH}
        target: /app/data/sessions
        bind:
          create_host_path: false
      - type: bind
        source: ${ARTIFACTS_PATH}
        target: /app/data/artifacts
        bind:
          create_host_path: false
    networks:
      - backend_net
    healthcheck:                              # Healthy once port 8000 accepts connections
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 60

  mcp-forgery:
    build:
      context: ./mcpForgeryContainer
    networks:
      - honeypot_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # Docker API access to write files into the honeypot
    healthcheck:                              # Healthy once port 8000 accepts connections
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 60

  attacker:
    build:
      context: ./attackerContainer
    profiles: ["attacker"]                    # Not started by a plain `docker compose up`: run it explicitly
    environment:
      - HONEYPOT_HOST=honeypot
      - HONEYPOT_PORT=2222
      - HONEYPOT_USER=honeypot
      - HONEYPOT_PASSWORD=password123
      - PROVIDER=cloud                        # cloud | local
      - MODEL_NAME=deepseek/deepseek-chat     # LLM model
      - MAX_TURNS=25
      - LLM_SECRET_FILE=/run/secrets/llm_config_secret_attacker   # key separate from the defense
    secrets:
      - llm_config_secret_attacker
    volumes:
      - ./attackerContainer/transcripts:/app/transcripts
    networks:
      - attack_net                            # Reaches only the honeypot, never the defense

    depends_on:
      - honeypot

networks:
  honeypot_net:
    driver: bridge
  backend_net:
    driver: bridge
  attack_net:                                 # Attacker <-> honeypot only
    driver: bridge

secrets:
  llm_config_secret:
    file: ./.env
  llm_config_secret_attacker:          # attacker's own key (see .env.attacker)
    file: ./.env.attacker